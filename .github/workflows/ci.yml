name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # lock 동기화 완료 — package-lock.json 을 표준 npm 으로 재생성해 package.json 과
      # 일치시켰으므로 npm ci(엄격, 결정적)로 재현 가능한 설치를 보장한다.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 단위 테스트 + lib/ 커버리지 게이트(#51). 커버리지가 바닥 임계 아래로
      # 떨어지면 실패한다(vitest.config.ts thresholds). 임계는 점진적으로 올린다.
      - name: Unit tests + coverage gate
        run: npm run test:coverage

      # 빌드 게이트 — 빌드 실패가 Vercel 배포에서 처음 드러나는 일을 막는다(#).
      - name: Build
        run: npm run build

      # 정보성(차단 안 함): high+ 취약점을 로그로 노출하되 머지는 막지 않는다.
      # 진짜 게이트는 typecheck/lint/test. 신뢰되는 lock 정착 후 차단형으로 승격 가능.
      - name: Security audit (informational)
        continue-on-error: true
        run: npm audit --audit-level=high
